name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      restore_pages_analytics:
        description: Restore the previous Pages Analytics configuration from deployment history
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: clearvault-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run test:release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clearvault-${{ github.sha }}
          path: |
            release/web/
            release/*.zip
            release/*.json
          retention-days: 30
          if-no-files-found: error
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: clearvault-${{ github.sha }}
          path: release
      - name: Check deployment configuration
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }
          test -n "$CF_ACCOUNT" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID secret'; exit 1; }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Restore previous Pages analytics when requested
        if: inputs.restore_pages_analytics == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/pages/projects/clearvault-safeincloud`;
          const headers = {
            Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
            'Content-Type': 'application/json',
          };
          async function request(url, options = {}) {
            const response = await fetch(url, { ...options, headers });
            const body = await response.json();
            if (!response.ok || !body.success) throw new Error(`Pages API request failed (HTTP ${response.status})`);
            return body.result;
          }
          const current = await request(endpoint);
          if (current.build_config?.web_analytics_token) {
            console.log('Existing Pages analytics configuration retained.');
          } else {
            const history = await request(endpoint + '/deployments?per_page=25');
            const previous = history.find((deployment) => deployment.build_config?.web_analytics_token);
            if (!previous) throw new Error('No previous analytics configuration found; restore it in the Cloudflare dashboard.');
            const config = previous.build_config;
            const updated = await request(endpoint, {
              method: 'PATCH',
              body: JSON.stringify({ build_config: {
                web_analytics_tag: config.web_analytics_tag,
                web_analytics_token: config.web_analytics_token,
              } }),
            });
            if (updated.build_config?.web_analytics_token !== config.web_analytics_token) throw new Error('Analytics restoration could not be verified');
            console.log('Previous Pages analytics configuration restored.');
          }
          JS
      - name: Deploy verified artifact to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          wranglerVersion: '4.152.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy release/web --project-name=clearvault-safeincloud --branch=main --commit-hash=${{ github.sha }}
